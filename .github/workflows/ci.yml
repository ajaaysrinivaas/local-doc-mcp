name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet-version: ['8.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore src/DocumentRagMcpServer.csproj

      - name: Build
        run: dotnet build src/DocumentRagMcpServer.csproj -c Release --no-restore

      - name: Check for errors
        run: dotnet build src/DocumentRagMcpServer.csproj -c Release --no-restore /p:TreatWarningsAsErrors=false

      - name: Publish Windows
        if: matrix.os == 'windows-latest'
        run: dotnet publish src/DocumentRagMcpServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish-windows

      - name: Publish Linux
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish src/DocumentRagMcpServer.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish-linux

      - name: Verify Windows build
        if: matrix.os == 'windows-latest'
        run: |
          if (-Not (Test-Path "./publish-windows/DocumentRagMcpServer.exe")) {
            Write-Error "Windows build failed: DocumentRagMcpServer.exe not found"
            exit 1
          }
        shell: pwsh

      - name: Verify Linux build
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ ! -f "./publish-linux/DocumentRagMcpServer" ]; then
            echo "Linux build failed: DocumentRagMcpServer not found"
            exit 1
          fi
