name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet-version: ['8.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore src/DocumentRagMcpServer.csproj

      - name: Build
        run: dotnet build src/DocumentRagMcpServer.csproj -c Release --no-restore

      - name: Publish
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            dotnet publish src/DocumentRagMcpServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish
          else
            dotnet publish src/DocumentRagMcpServer.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish
          fi
        shell: bash

      - name: Verify binary exists
        run: ls -lh publish/
        shell: bash
